services:
  - type: web
    name: studyhelper
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: APP_ENV
        value: production
      - key: MODE
        value: webhook
      - key: HOST
        value: 0.0.0.0
      - key: DEFAULT_LANGUAGE
        value: uz
      - key: BUSINESS_TIMEZONE
        value: Asia/Tashkent
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: studyhelper-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: studyhelper-redis
          type: keyvalue
          property: connectionString
      - key: WEBHOOK_BASE_URL
        value: https://studyhelper.onrender.com
      - key: WEBHOOK_SECRET_TOKEN
        sync: false
      - key: WEBHOOK_PATH_SECRET
        sync: false
      - key: DB_POOL_SIZE
        value: 2
      - key: DB_MAX_OVERFLOW
        value: 1

  - type: keyvalue
    name: studyhelper-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off
    ipAllowList: []

databases:
  - name: studyhelper-db
    databaseName: studyhelper
    user: studyhelper
    plan: free
    region: frankfurt
    ipAllowList: []
