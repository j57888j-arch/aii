services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studyhelper
      POSTGRES_USER: studyhelper
      POSTGRES_PASSWORD: studyhelper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyhelper -d studyhelper"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    env_file:
      - .env
    environment:
      MODE: polling
      DATABASE_URL: postgresql+asyncpg://studyhelper:studyhelper@postgres:5432/studyhelper
      REDIS_URL: redis://redis:6379/0
    ports:
      - "10000:10000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
